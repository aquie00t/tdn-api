name: Release

on:
    # Runs after CI passes on main — avoids releasing broken builds
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

permissions:
    contents: write # Create tags, releases, commit CHANGELOG
    packages: write # Push to GHCR
    issues: write # semantic-release can comment on issues
    pull-requests: write # semantic-release can comment on PRs
    id-token: write # OIDC for attestations (future-proof)

jobs:
    release:
        name: Semantic Release
        runs-on: ubuntu-latest
        # Only run when CI succeeded
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        outputs:
            new_release_published: ${{ steps.release.outputs.new_release_published }}
            new_release_version: ${{ steps.release.outputs.new_release_version }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
              with:
                  # Full history required for semantic-release to analyze all commits
                  fetch-depth: 0
                  persist-credentials: false

            - name: Run Semantic Release
              id: release
              uses: cycjimmy/semantic-release-action@v6
              with:
                  # Extra plugins not bundled with cycjimmy action
                  extra_plugins: |
                      @semantic-release/changelog@6
                      @semantic-release/git@10
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    migrate:
        name: Apply Database Migrations
        runs-on: ubuntu-latest
        needs: release
        # Only when semantic-release cut a version, and before the image that
        # expects the new schema becomes pullable.
        if: ${{ needs.release.outputs.new_release_published == 'true' }}
        # Gives the run a deployment record, and a place to hang required
        # reviewers on if this should ever need approval.
        environment: production
        env:
            # Deliberately no NODE_ENV=production here: pnpm would then skip
            # devDependencies, and the Prisma CLI this job runs is one. The
            # datasource url comes from the step env either way - prisma.config
            # reads process.env.DATABASE_URL, and the .env file it looks for
            # does not exist on a runner.
            HUSKY: "0"
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Verify the database URL is configured
              # Without this the job would fail deeper in, with a Prisma error
              # that does not say the secret is the thing that is missing.
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                    echo "::error::The DATABASE_URL secret is not set. Migrations cannot be applied, so the release would ship code ahead of its schema."
                    exit 1
                  fi

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Show Pending Migrations
              # Records in the run log what this release is about to apply.
              # Exits non-zero precisely when there is something pending, which
              # is the normal case here, so its status is not the job's.
              continue-on-error: true
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: pnpm prisma migrate status

            - name: Apply Migrations
              # deploy, never dev or reset: it only applies migrations that have
              # not run yet, never rewrites or drops anything, and takes an
              # advisory lock so overlapping releases queue instead of racing.
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: pnpm db:deploy

    docker-push:
        name: Push Docker Image to GHCR
        runs-on: ubuntu-latest
        # Waits on migrate as well: an image whose schema has not been applied
        # is exactly how notifications started answering 500 in production.
        needs: [release, migrate]
        # Only runs when semantic-release actually created a new version
        if: ${{ needs.release.outputs.new_release_published == 'true' }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}:v${{ needs.release.outputs.new_release_version }}
                      ghcr.io/${{ github.repository }}:latest
                  # Reuse cached layers from docker.yml CI validation runs
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
