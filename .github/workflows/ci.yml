name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Cancel in-progress runs for the same branch/PR to avoid redundant work
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# Shared env for all jobs
env:
    NODE_ENV: test
    DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/tdn_test
    REDIS_URL: redis://localhost:6379
    ACCESS_TOKEN_SECRET_KEY: test_secret_token_123
    COOKIE_SECRET: test_cookie_secret_123
    GITHUB_CLIENT_ID: dummy_github_id
    GITHUB_CLIENT_SECRET: dummy_github_secret
    GOOGLE_CLIENT_ID: dummy_google_id
    GOOGLE_CLIENT_SECRET: dummy_google_secret
    DISABLE_RATE_LIMIT: true
    HUSKY: "0"

jobs:
    quality:
        name: Quality Checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm prisma generate

            - name: Check Formatting
              run: pnpm format:check

            - name: Check Linting
              run: pnpm lint

            - name: Run Build
              run: pnpm build

            # Advisory-driven: a new CVE published upstream can turn an unrelated
            # PR red without anything in it changing. Reported, but not blocking —
            # security.yml runs dependency-review on PRs and a weekly scan.
            - name: Audit Dependencies
              run: pnpm audit --audit-level=high
              continue-on-error: true

    test-unit:
        name: Unit Tests
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm prisma generate

            - name: Run Unit Tests with Coverage
              run: pnpm run test:unit:coverage

            - name: Upload Coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  fail_ci_if_error: false

    test-integration:
        name: Integration Tests
        runs-on: ubuntu-latest
        needs: quality
        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpassword
                    POSTGRES_DB: tdn_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm prisma generate

            - name: Push Schema to Test DB
              run: pnpm prisma db push

            - name: Run Integration Tests
              run: pnpm run test:integration

    test-e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        needs: quality
        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpassword
                    POSTGRES_DB: tdn_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm prisma generate

            - name: Push Schema to Test DB
              run: pnpm prisma db push

            - name: Run E2E Tests
              run: pnpm run test:e2e
