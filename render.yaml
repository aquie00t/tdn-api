# Originally exported from Render on 2026-05-04T18:29:38Z, edited since.
#
# Region: this says `oregon` because that is where the service runs, and this
# file has to describe the service rather than the one we would like. Render
# refuses a blueprint whose region differs from the running service - "changing
# region not supported" - and refusing it fails the whole sync, so a hopeful
# value here blocks every other change in the file as well.
#
# It should be `frankfurt`. Redis is already in eu-central-1 and the readers are
# in Turkey, where Frankfurt answers in 88 ms against 266 ms for Ohio and 287 ms
# for Oregon; the API pays that distance again on every database and cache round
# trip, and a ranked feed page makes about a dozen. Getting there means creating
# a new service in Frankfurt and moving the domain to it. Edit this line in the
# same change that does so, not before.
#
# Plan: `starter`, not `free`. A free instance sleeps after fifteen minutes and
# then makes the next visitor wait out a cold start, which on a site this quiet
# is most of them.
version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: tdn-api
      runtime: docker
      repo: https://github.com/the-developer-network/tdn-api
      plan: starter
      envVars:
      - key: MODERATION_ENABLED
        sync: false
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false
      - key: OTP_EXPIRY_SECONDS
        sync: false
      - key: USER_PURGE_GRACE_PERIOD_DAYS
        sync: false
      - key: USER_PURGE_CRON
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REFRESH_TOKEN_PURGE_GRACE_PERIOD_DAYS
        sync: false
      - key: REFRESH_TOKEN_PURGE_CRON
        sync: false
      - key: REFRESH_TOKEN_EXPIRES_IN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: PORT
        sync: false
      - key: NOTIFICATION_PURGE_GRACE_PERIOD_DAYS
        sync: false
      - key: NOTIFICATION_PURGE_CRON
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: API_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRES_IN
        sync: false
      region: oregon
      dockerContext: .
      dockerfilePath: ./Dockerfile
      domains:
      - api.developernetwork.net
      autoDeployTrigger: commit
