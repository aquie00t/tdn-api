# pnpm 11 reads overrides from here, NOT from the "pnpm" field in package.json.
# Keeping them in package.json makes pnpm ignore them silently (they only show
# up as a warning), which leaves the pinned advisories unpatched in the tree.
#
# Security floors: use ">=" rather than an exact pin. An exact pin both blocks
# the next patch release and forces a downgrade of whatever dependabot merged.
overrides:
  hono: '>=4.12.25' # GHSA advisory, was pinned at 4.12.18
  '@hono/node-server': 1.19.13
  fast-xml-parser: ^5.5.7
  lodash: '>=4.18.0' # GHSA-r5fr-rjxr-66jc, was pinned at 4.17.23 (vulnerable)
  effect: 3.20.0
  picomatch: ^4.0.4
  yaml: ^2.8.3
  brace-expansion: '>=5.0.9' # was ^5.0.5, below the patched range
  fast-jwt: 6.2.4
  fast-uri: '>=4.1.3' # GHSA-5jgf/f65p/fph4/jqff, was >=3.1.5 which let 4.1.2 in
  vite: 8.0.16 # kept exact: mirrors the devDependency
  ws: '>=8.21.0' # was >=8.20.1, below the patched range
  deepmerge-ts: '>=8.0.0' # GHSA DoS via recursive graphs; @prisma/config pins 7.1.5 exactly
  # Reached only through the Prisma CLI, which carries it for MySQL datasources
  # this project does not use - but the CLI is a runtime dependency now, so the
  # code ships. GHSA-3f6p (auth downgrade) and GHSA-rgwj (decompression bomb).
  mysql2: '>=3.23.1'

allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
ignoredBuiltDependencies:
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma
